name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test suite
        run: python3 -m unittest discover -s tests

  go:
    name: Go implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      # The browser build has a js/wasm build tag, so the steps above never
      # compile it. Without this a break in it would only surface at deploy.
      - name: Browser build
        run: |
          GOOS=js GOARCH=wasm go vet ./cmd/wasmsolver
          ./scripts/build_wasm.sh

  conformance:
    name: Go agrees with Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      # The grid is bounded by how far the deliberately-naive Python reference
      # can reach, not by Go. That is the intended trade: an oracle that shared
      # Go's optimisations could not detect a flaw in them.
      - name: Grade Go against the reference
        run: python3 scripts/conformance.py --max-order 8 --distances 1,2,3

  properties:
    name: Measured properties still hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Monotonicity in k and d
        run: python3 scripts/verify_properties.py --max-vertices 8
